<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zizzly - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
       <div class="logo" href="index.html"><img src="logo.jpg"width="110"height="100">
</div>
        <nav class="nav-links">
            <a href="index.html" class="nav-btn">About</a>
            <a href="activities.html" class="nav-btn">Activities</a>
        </nav>
        <div class="auth-links">
            <a href="signup.html" class="signup-btn active-btn">Sign up</a>
            <a href="login.html" class="login-btn">Log in</a>
        </div>
    </header>
    <main class="main-content auth-container">
        <h1>Sign Up for Zizzly</h1>
        <form>
            <input type="text" placeholder="Full Name" required><br>
            <input type="email" placeholder="Email Address" required><br>
            <input type="password" placeholder="Password" required><br>
            <button type="submit" class="sub-btn">Create Account</button>
        </form>
    </main>
</body>
</html>
